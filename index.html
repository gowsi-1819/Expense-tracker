<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance">
        <h2>
            Balance: ₹<span id="balance">0</span>
            <span id="statusEmoji">🙂</span>
        </h2>
        <p class="income">Income: ₹<span id="income">0</span></p>
        <p class="expense">Expense: ₹<span id="expense">0</span></p>
    </div>

    <div class="limit-section">
        <input type="number" id="limit" placeholder="Set Monthly Expense Limit">
    </div>

    <div class="form">
        <input type="text" id="text" placeholder="Description">
        <input type="number" id="amount" placeholder="Amount">
        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <button onclick="addTransaction()">Add</button>
    </div>

    <ul id="list"></ul>

    <canvas id="chart"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
